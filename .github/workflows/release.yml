name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable-windows:
    name: portable windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build and test dependencies
        run: python -m pip install -e ".[build,dev]"

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Build
        run: python -m PyInstaller build\seas-audio.spec --noconfirm

      - name: Verify the frozen build
        shell: pwsh
        run: |
          $dir = "build\dist\SeasAudioTools"
          $exe = Join-Path $dir "SeasAudioTools.exe"
          if (-not (Test-Path $exe)) { throw "Missing executable" }
          if (-not (Test-Path (Join-Path $dir "_internal\fpcalc.exe"))) { throw "fpcalc.exe was not bundled" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
            throw "The application exited during startup"
          }
          Stop-Process -Id $p.Id -Force
          "Frozen build launched successfully."

      - name: Stage and zip
        run: python build/make_release.py --version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: release/*.zip
          retention-days: 30

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/*.zip `
            --title "Seas Audio Tools ${{ github.ref_name }}" `
            --generate-notes